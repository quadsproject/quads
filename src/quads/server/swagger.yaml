openapi: 3.0.0
info:
  version: '2.2.6'
  title: 'QUADS'
  description: |-
    QUADS automates the future scheduling, end-to-end provisioning and delivery of bare-metal servers and networks.

    This is it's REST API implementation.

    Some useful links:
    - [Quads repository](https://github.com/quadsproject/quads)
    - [Quads blog](https://quads.dev)
  license:
    name: GPLv3
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: 'https://quads.example.com/api/v3/'

tags:
  - name: Auth
    description: Everything about authentication
  - name: Clouds
    description: Operations about clouds
  - name: Assignments
    description: Operations about assignments
  - name: Hosts
    description: Operations about hosts
  - name: Interfaces
    description: Operations about interfaces
  - name: Disks
    description: Operations about disks
  - name: Memory
    description: Operations about memory
  - name: Processors
    description: Operations about processors
  - name: Vlans
    description: Operations about vlans
  - name: Schedules
    description: Operations about schedules
  - name: Available
    description: Operations about hosts availability
  - name: Moves
    description: Operations about hosts transitions
  - name: API Tokens
    description: Operations about API tokens for programmatic access
  - name: Other
    description: Other operations

paths:

  /login/:
    post:
      summary: Login endpoint with Basic Auth that returns token for Bearer Auth
      tags:
        - Auth
      security:
        - BasicAuth: []
      responses:
        '201':
          description: Successful user login
          content:
            application/json:
              schema:
                properties:
                  auth_token:
                    description: Authentication Token
                    type: string
                    example: 7h1515aV3rYkr1p71k70k3n
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /logout/:
    post:
      summary: Logout endpoint for blacklisting authentication token
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful user logout
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /register/:
    post:
      summary: Register new users
      tags:
        - Auth
      requestBody:
        description: Body request with *user* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: quads@redhat.com
                password:
                  type: string
                  example: 7h1515aV3rYkr1p71k70k3n
      responses:
        '200':
          description: New user authentication token
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Successful login
                  auth_token:
                    description: Authentication Token
                    type: string
                    example: 7h1515aV3rYkr1p71k70k3n
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me:
    get:
      summary: Returns the authenticated user identity and roles
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: quads@redhat.com
                  roles:
                    type: array
                    items:
                      type: string
                    example: ["user"]
        '400':
          description: Missing or malformed Authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clouds/:
    get:
      summary: Returns a list with all the defined clouds
      tags:
        - Clouds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Cloud'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a new cloud
      tags:
        - Clouds
      requestBody:
        description: Body request with *cloud* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cloud
              properties:
                cloud:
                  type: string
                  example: cloud12
          text/plain:
            schema:
              type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
      security:
        - BearerAuth: [ ]

  /clouds/{cloudName}/:
    delete:
      summary: Delete cloud by cloud name
      tags:
        - Clouds
      parameters:
        - name: cloudName
          in: path
          description: Cloud name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted Cloud
      security:
        - BearerAuth: [ ]
    patch:
        summary: Update an existing cloud
        tags:
            - Clouds
        parameters:
            - name: cloudName
              in: path
              description: Cloud name
              required: true
              schema:
                  type: string
        requestBody:
          description: Body request with *cloud* details
          required: true
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/Cloud'
        responses:
            '200':
              description: Cloud name
              headers:
                x-next:
                  description: A link to the next page of responses
                  schema:
                    type: string
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Cloud'
            default:
              description: Unexpected error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
        security:
            - BearerAuth: [ ]

  /clouds/free/:
    get:
      summary: Returns all free clouds that are available for new assignments
      tags:
        - Clouds
      responses:
        '200':
          description: Free clouds
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cloud'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clouds/summary/:
    get:
      summary: Returns all clouds summary
      tags:
        - Clouds
      parameters:
        - name: date
          in: query
          description: Date for time-bound summary (format YYYY-MM-DDTHH:MM)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Cloud summary
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CloudSummary'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/:
    get:
      summary: Returns a list with all the defined hosts
      tags:
        - Hosts
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Filter hosts by name.
        - in: query
          name: model
          schema:
            type: string
          description: Filter hosts by model name.
        - in: query
          name: host_type
          schema:
            type: string
          description: Filter hosts by type.
        - in: query
          name: build
          schema:
            type: boolean
          description: Filter by build status.
        - in: query
          name: validated
          schema:
            type: boolean
          description: Filter by validated status.
        - in: query
          name: switch_config_applied
          schema:
            type: boolean
          description: Filter by switch config applied status.
        - in: query
          name: broken
          schema:
            type: boolean
          description: Filter by broken status.
        - in: query
          name: retired
          schema:
            type: boolean
          description: Filter by retired status.
        - in: query
          name: last_build
          schema:
            type: string
          description: Filter by last build date.
        - in: query
          name: created_on
          schema:
            type: string
          description: Filter by created on date.
      responses:
        '200':
          description: Host name
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add a new host
      tags:
        - Hosts
      requestBody:
        description: Body request with *host* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - model
                - host_type
                - rack
                - uloc
              properties:
                name:
                  type: string
                  example: host.example.com
                model:
                  type: string
                  example: r640
                host_type:
                  type: string
                  example: vendor
                rack:
                  type: string
                  example: f01
                uloc:
                  type: string
                  example: h01
                blade:
                  type: string
                  example: b01
                default_cloud:
                  type: string
                  example: cloud01
                can_self_schedule:
                  type: boolean
                  example: false
                overcloud:
                  type: boolean
                  example: false
                bootmode:
                  type: string
                  example: Bios
          text/plain:
            schema:
              type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

  /hosts/availability_summary:
    get:
      summary: Returns host availability summary over two and four week windows
      tags:
        - Hosts
      parameters:
        - name: now
          in: query
          description: Current date reference point
          required: true
          schema:
            type: string
        - name: two_week_start
          in: query
          description: Start of the two week reporting window
          required: true
          schema:
            type: string
        - name: two_week_end
          in: query
          description: End of the two week reporting window
          required: true
          schema:
            type: string
        - name: four_week_end
          in: query
          description: End of the four week reporting window
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Host availability summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        '400':
          description: Bad Request - missing or invalid dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/{hostName}:
    get:
      summary: Returns a host by name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Host name
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update an existing host
      tags:
        - Hosts
      requestBody:
        description: Body request with *host* details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostClean'
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Host name
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

    delete:
      summary: Delete host by host name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Hostname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted Host
      security:
        - BearerAuth: [ ]

  /hosts/{hostName}/memory:
    get:
      summary: Returns a host memory by host name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/{hostName}/processors:
    get:
      summary: Returns a host processors by host name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Processors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Processor'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/{hostName}/disks:
    get:
      summary: Returns a host disks by host name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disk'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/{hostName}/interfaces:
    get:
      summary: Returns a host interfaces by host name
      tags:
        - Hosts
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Interfaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/os_list:
    get:
      summary: Returns a list of available OS images
      tags:
        - Hosts
      responses:
        '200':
          description: Available OS images
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id:
                      type: string
                    Title:
                      type: string
                    Release Name:
                      type: string
                    Family:
                      type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disks/:
    get:
      summary: Returns all disks
      tags:
        - Disks
      responses:
        '200':
          description: Disks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disk'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disks/types:
    get:
      summary: Returns a list of distinct disk types
      tags:
        - Disks
      responses:
        '200':
          description: Disk types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /disks/{disk_id}:
    get:
      summary: Returns a specific disk by disc id
      tags:
        - Disks
      parameters:
        - name: disk_id
          in: path
          description: Disk ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete disk on host by disk id
      tags:
        - Disks
      parameters:
        - name: disk_id
          in: path
          description: Disk ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted Disk
      security:
        - BearerAuth: [ ]

  /disks/{hostName}:
    post:
      summary: Create a host disk definition
      tags:
        - Disks
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      requestBody:
        description: Body request with *disk* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - disk_type
                - size_gb
                - count
              properties:
                disk_type:
                  type: string
                  example: nvme
                size_gb:
                  type: integer
                  example: 2000
                count:
                  type: integer
                  example: 10
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Disk details
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

    patch:
      summary: Update an existing host disks definitions
      tags:
        - Disks
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      requestBody:
        description: Body request with *disk* details. The disk_id identifies which disk to update.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - disk_id
              properties:
                disk_id:
                  type: integer
                  example: 1
                disk_type:
                  type: string
                  example: nvme
                size_gb:
                  type: integer
                  example: 2000
                count:
                  type: integer
                  example: 10
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Disk details
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disk'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

  /interfaces/:
    get:
      summary: Returns a list of all interfaces
      tags:
        - Interfaces
      responses:
        '200':
          description: Interface details list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interfaces/{interface_id}:
    get:
      summary: Returns a specific interface for a specific interface id
      tags:
        - Interfaces
      parameters:
        - name: interface_id
          in: path
          description: Interface ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Interface details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /interfaces/{hostName}:
    post:
      summary: Create a host interface definition
      tags:
        - Interfaces
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      requestBody:
        description: Body request with *interface* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - mac_address
                - switch_ip
                - switch_port
              properties:
                name:
                  type: string
                  example: em1
                mac_address:
                  type: string
                  example: aa:00:bb:11:cc:22
                switch_ip:
                  type: string
                  example: 10.1.1.18
                switch_port:
                  type: string
                  example: xt-0-0/1
                bios_id:
                  type: string
                  example: nic1
                speed:
                  type: integer
                  example: 1000
                vendor:
                  type: string
                  example: Intel
                pxe_boot:
                  type: boolean
                  example: true
                maintenance:
                  type: boolean
                  example: false
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Interface details list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

    patch:
      summary: Update an existing host interface definitions
      tags:
        - Interfaces
      parameters:
        - name: hostName
          in: path
          description: Host name
          required: true
          schema:
            type: string
      requestBody:
        description: Body request with *interface* details. The id identifies which interface to update.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  example: 12
                name:
                  type: string
                  example: em1
                mac_address:
                  type: string
                  example: aa:00:bb:11:cc:22
                switch_ip:
                  type: string
                  example: 10.1.1.18
                switch_port:
                  type: string
                  example: xt-0-0/1
                bios_id:
                  type: string
                  example: nic1
                speed:
                  type: integer
                  example: 1000
                vendor:
                  type: string
                  example: Intel
                pxe_boot:
                  type: boolean
                  example: true
                maintenance:
                  type: boolean
                  example: false
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Interface details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interface'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - BearerAuth: [ ]

  /interfaces/{hostName}/{ifName}:

    delete:
      summary: Delete interface on host by interface id
      tags:
        - Interfaces
      parameters:
        - name: hostName
          in: path
          description: Hostname
          required: true
          schema:
            type: string
        - name: ifName
          in: path
          description: Interface name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted Interface
      security:
        - BearerAuth: [ ]

  /memory/:
    get:
      summary: Returns a list of all memory
      tags:
        - Memory
      responses:
        '200':
          description: Memory details list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/{memory_id}:
    get:
      summary: Returns a specific memory for a specific memory id
      tags:
        - Memory
      parameters:
        - name: memory_id
          in: path
          description: Memory ID
