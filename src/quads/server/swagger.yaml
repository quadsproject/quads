            required: true
            schema:
              type: string
        requestBody:
            description: Body request with *notification* details
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Notification'
        responses:
          '200':
            description: Updated notification
        security:
            - BearerAuth: [ ]

  /available/:
    get:
      summary: Returns a list of available hosts
      tags:
        - Available
      parameters:
        - name: start
          in: query
          description: Start date
          required: false
          schema:
            type: string
        - name: end
          in: query
          description: End date
          required: false
          schema:
            type: string
        - name: cloud
          in: query
          description: Cloud
          required: false
          schema:
            type: string
        - name: model
          in: query
          description: Filter by host model
          required: false
          schema:
            type: string
        - name: host_type
          in: query
          description: Filter by host type
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /available/{hostname}:
    get:
      summary: Returns a boolean for whether the host is available or not
      tags:
        - Available
      parameters:
        - name: hostname
          in: path
          description: Hostname
          required: true
          schema:
            type: string
        - name: start
          in: query
          description: Start date
          required: false
          schema:
            type: string
        - name: end
          in: query
          description: End date
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Hosts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Host'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/:
    get:
      summary: Returns a list of hosts that are transitioning with the source and target clouds
      tags:
        - Moves
      parameters:
        - name: date
          in: query
          description: Date
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Moves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Move'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/progress/:
    get:
      summary: Returns all active move progress records
      tags:
        - Moves
      parameters:
        - name: cloud
          in: query
          description: Filter by target cloud
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by move status
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Move progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoveProgress'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/progress/{hostname}:
    get:
      summary: Returns move progress for a specific host
      tags:
        - Moves
      parameters:
        - name: hostname
          in: path
          description: Hostname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Move progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveProgress'
        '404':
          description: No active move for the host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/progress/batch:
    post:
      summary: Start move tracking for a batch of hosts
      tags:
        - Moves
      requestBody:
        description: Body request with *hostnames* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hostnames
              properties:
                hostnames:
                  type: array
                  items:
                    type: string
                  example: [host01.example.com, host02.example.com]
      security:
        - BearerAuth: [ ]
      responses:
        '201':
          description: Move tracking started
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request - hostnames list required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /moves/progress/{schedule_id}:
    patch:
      summary: Update move status on a schedule
      tags:
        - Moves
      parameters:
        - name: schedule_id
          in: path
          description: Schedule ID
          required: true
          schema:
            type: integer
      requestBody:
        description: Body request with *move progress* details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: New move status
                message:
                  type: string
                error_message:
                  type: string
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Updated move progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveProgress'
        '400':
          description: Bad Request - invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/:
    get:
      summary: Returns the user matching the google_id query parameter
      tags:
        - Other
      parameters:
        - name: google_id
          in: query
          description: Google ID of the user
          required: true
          schema:
            type: string
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request - google_id required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Register a new user (admin)
      tags:
        - Other
      requestBody:
        description: Body request with *user* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: user@example.com
                google_id:
                  type: string
                profile_picture:
                  type: string
                active:
                  type: boolean
                  example: true
                fs_uniquifier:
                  type: string
      security:
        - BearerAuth: [ ]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request - email required
        '403':
          description: Forbidden - admin role required

  /users/{email}:
    get:
      summary: Returns a user by email (admin)
      tags:
        - Other
      parameters:
        - name: email
          in: path
          description: User email
          required: true
          schema:
            type: string
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin role required
    patch:
      summary: Update a user (admin)
      tags:
        - Other
      parameters:
        - name: email
          in: path
          description: User email
          required: true
          schema:
            type: string
      requestBody:
        description: Body request with *user* details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssh_key:
                  type: string
                release_command:
                  type: string
                google_id:
                  type: string
                profile_picture:
                  type: string
                active:
                  type: boolean
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin role required

  /tokens/{email}/:
    get:
      summary: List all API tokens for a user
      tags:
        - API Tokens
      parameters:
        - name: email
          in: path
          description: User email
          required: true
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
        '403':
          description: Forbidden - cannot manage tokens for another user
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new named API token
      description: >
        Generates a new API token with the given name. The raw token value is
        returned only in this response and cannot be retrieved again. Store it
        securely. Use as `Authorization: Bearer qat_...` for API access.
      tags:
        - API Tokens
      parameters:
        - name: email
          in: path
          description: User email
          required: true
          schema:
            type: string
      requestBody:
        description: Token name
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: CI pipeline
                  maxLength: 256
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Token created. The `token` field contains the raw value (shown only once).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiToken'
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Raw token value (shown only once)
                        example: qat_Ab3xKm9pQ7...
        '400':
          description: Bad request (missing name or duplicate name)
        '403':
          description: Forbidden
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tokens/{email}/{tokenId}:
    delete:
      summary: Revoke an API token
      tags:
        - API Tokens
      parameters:
        - name: email
          in: path
          description: User email
          required: true
          schema:
            type: string
        - name: tokenId
          in: path
          description: Token ID
          required: true
          schema:
            type: integer
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token deleted
        '403':
          description: Forbidden
        '404':
          description: Token not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /version/:
    get:
      summary: Returns Quads version
      tags:
        - Other
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                type: string
                example: "QUADS version 2.2.6 maximilian"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Cloud:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: cloud12
        last_redefined:
          type: string
          example: 1984-02-02
    CloudSummary:
      type: object
      properties:
        name:
          type: string
          example: cloud12
        count:
          type: integer
          example: 10
        description:
          type: string
          example: Short description here
        owner:
          type: string
          example: jsbach
        ticket:
          type: string
          example: 2122
        ccuser:
          type: array
          items:
            type: string
          example: [edroste, kgodel]
        provisioned:
          type: boolean
          example: true
        validated:
          type: boolean
          example: true
        is_self_schedule:
          type: boolean
          example: false
    Disk:
      type: object
      properties:
        disk_id:
          type: integer
          example: 1
        disk_type:
          type: string
          example: nvme
        size_gb:
          type: integer
          example: 2000
        count:
          type: integer
          example: 10
        host_id:
          type: integer
          example: 10
    Memory:
      type: object
      required:
        - size_gb
        - handle
        - host_id
      properties:
        id:
          type: integer
          example: 12
        size_gb:
          type: integer
          example: 2000
        handle:
          type: string
          example: MMD
        host_id:
          type: integer
          example: 10
    Processor:
      type: object
      properties:
        id:
          type: integer
          example: 12
        handle:
          type: string
          example: CoreI7
        vendor:
          type: string
          example: Intel
        product:
          type: string
          example: i7
        cores:
          type: integer
          example: 20
        threads:
          type: integer
          example: 20
        processor_type:
          type: string
          example: x86
        host_id:
          type: integer
          example: 10
    Interface:
      type: object
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: em1
        bios_id:
          type: string
          example: nic1
        mac_address:
          type: string
          example: aa:00:bb:11:cc:22
        switch_ip:
          type: string
          example: 10.1.1.18
        switch_port:
          type: string
          example: xt-0-0/1
        speed:
          type: integer
          example: 1000
        vendor:
          type: string
          example: Intel
        pxe_boot:
          type: boolean
          example: true
        maintenance:
          type: boolean
          example: false
        host_id:
          type: integer
          example: 10
    HostClean:
      type: object
      properties:
        name:
          type: string
          example: host.example.com
        model:
          type: string
          example: r640
        host_type:
          type: string
          example: vendor
        build:
          type: boolean
          example: true
        validated:
          type: boolean
          example: true
        switch_config_applied:
          type: boolean
          example: true
        broken:
          type: boolean
          example: true
        retired:
          type: boolean
          example: true
        can_self_schedule:
          type: boolean
          example: false
        overcloud:
          type: boolean
          example: false
        rack:
          type: string
          example: A1
        uloc:
          type: string
          example: U10
        blade:
          type: string
          example: blade1
        bootmode:
          type: string
          example: uefi
        last_build:
          type: string
          example: 2022-02-02
        cloud_id:
          type: integer
          example: 12
        default_cloud_id:
          type: integer
          example: 1
    Host:
      type: object
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: host.example.com
        model:
          type: string
          example: r640
        host_type:
          type: string
          example: vendor
        build:
          type: boolean
          example: true
        validated:
          type: boolean
          example: true
        switch_config_applied:
          type: boolean
          example: true
        broken:
          type: boolean
          example: true
        retired:
          type: boolean
          example: true
        can_self_schedule:
          type: boolean
          example: false
        overcloud:
          type: boolean
          example: false
        rack:
          type: string
          example: A1
        uloc:
          type: string
          example: U10
        blade:
          type: string
          example: blade1
        bootmode:
          type: string
          example: uefi
        last_build:
          type: string
          example: 2022-02-02
        cloud_id:
          type: integer
          example: 12
        default_cloud_id:
          type: integer
          example: 1
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/Interface'
        disks:
          type: array
          items:
            $ref: '#/components/schemas/Disk'
        memory:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        processors:
          type: array
          items:
            $ref: '#/components/schemas/Processor'
    ScheduleHostsRange:
      type: object
      properties:
        host:
          type: string
          example: host.example.com
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
    Assignment:
      type: object
      properties:
        active:
          type: boolean
          example: true
        provisioned:
          type: boolean
          example: true
        validated:
          type: boolean
          example: true
        is_self_schedule:
          type: boolean
          example: false
        description:
          type: string
          example: Short description here
        owner:
          type: string
          example: jsbach
        ticket:
          type: string
          example: 2122
        qinq:
          type: integer
          example: 1
        wipe:
          type: boolean
          example: true
        ccuser:
          type: array
          items:
            type: string
          example: [edroste, kgodel]
        ostype:
          type: string
          example: rhel9
        cloud_id:
          type: integer
          example: 12
        vlan_id:
          type: integer
          example: 12

    Schedule:
      type: object
      properties:
        start:
          type: string
          example: 2022-02-02T22:00
        end:
          type: string
          example: 2022-04-02T22:00
        build_start:
          type: string
          example: 2022-02-02T22:00
        build_end:
          type: string
          example: 2022-04-02T22:00
        assignment_id:
          type: integer
          example: 12
        host_id:
          type: integer
          example: 1

    Move:
      type: object
      properties:
        host:
          type: string
          example: host.example.com
        new:
          type: string
          example: cloud09
        current:
          type: string
          example: cloud01
    MoveProgress:
      type: object
      properties:
        id:
          type: integer
          example: 42
        host:
          type: string
          example: host.example.com
        host_id:
          type: integer
          example: 15
        source_cloud:
          type: string
          example: cloud01
        target_cloud:
          type: string
          example: cloud02
        status:
          type: string
          example: provisioning
        message:
          type: string
          example: Provisioner ready
        error_message:
          type: string
          nullable: true
        started_at:
          type: string
          example: 2026-06-02T12:00:00
        completed_at:
          type: string
          nullable: true

    Notification:
      type: object
      properties:
        fail:
          type: boolean
          example: false
        success:
          type: boolean
          example: false
        initial:
          type: boolean
          example: false
        pre_initial:
          type: boolean
          example: false
        pre:
          type: boolean
          example: false
        one_day:
          type: boolean
          example: false
        three_days:
          type: boolean
          example: false
        five_days:
          type: boolean
          example: false
        seven_days:
          type: boolean
          example: false
        assignment:
          type: integer
          example: 12
    Vlan:
      type: object
      properties:
        gateway:
          type: string
          example: 10.1.18.8
        ip_free:
          type: integer
          example: 256
        ip_range:
          type: string
        netmask:
          type: string
          example: 255.255.255.255
        vlan_id:
          type: integer
          example: 601
    Role:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: admin
        description:
          type: string
          example: All access granted
    User:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          example: quads@example.com
        active:
          type: boolean
          example: true
        confirmed_at:
          type: string
          example: 1984-02-02T22:00
        auth_token:
          type: string
          example: 1984-02-02T22:00
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    ApiToken:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: CI pipeline
        token_prefix:
          type: string
          description: First 12 characters of the token for identification
          example: qat_Ab3xKm9p
        created_at:
          type: string
          example: Mon, 19 May 2026 12:00:00 GMT
        last_used:
          type: string
          nullable: true
          example: null
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
          format: int32
        message:
          type: string
          example: Something went horribly wrong.
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    BearerAuth:
      type: http
      scheme: bearer
