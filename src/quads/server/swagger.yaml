  /schedules/batch:
    post:
      summary: Create multiple schedules at once with optional JIRA integration
      description: >
        Validates all hosts before creating any schedules; if any host is
        unavailable the entire operation fails. Creates a new assignment when
        assignment details are provided, otherwise reuses the existing active
        assignment for the cloud.
      tags:
        - Schedules
      requestBody:
        description: Body request with *batch schedule* details
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cloud
                - hostnames
                - start
                - end
              properties:
                cloud:
                  type: string
                  example: cloud02
                hostnames:
                  type: array
                  items:
                    type: string
                  example: [host01.example.com, host02.example.com]
                start:
                  type: string
                  example: 2026-05-08 10:00
                end:
                  type: string
                  example: 2026-05-09 22:00
                description:
                  type: string
                  example: Testing environment
                owner:
                  type: string
                  example: jdoe
                ticket:
                  type: string
                  example: 5473
                ccuser:
                  type: string
                  example: wfoster,kgodel
                vlan:
                  type: integer
                  example: 1234
                qinq:
                  type: integer
                  example: 0
                wipe:
                  type: boolean
                  example: true
      security:
        - BearerAuth: [ ]
      responses:
        '201':
          description: Schedules created
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment_id:
                    type: integer
                  schedules_created:
                    type: integer
                  hostnames:
                    type: array
                    items:
                      type: string
                  jira_updated:
                    type: boolean
        '400':
          description: Bad Request - one or more hosts unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

