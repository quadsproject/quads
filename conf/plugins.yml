plugins:
  slack:
    enabled: true
    webhook_url: https://hooks.slack.com/...

  gchat:
    enabled: false
    webhook_url: https://chat.example.com/v1/spaces/AAABBBCCC

  irc:
    enabled: false
    server: irc.example.com
    port: 6667
    ssl: false
    default_channel: "#quads"

  # Cloud Providers - Provision from cloud when local bare metal is exhausted
  aws_cloud:
    enabled: false # Enable when you want cloud overflow capacity
    region: us-east-1
    access_key: ${AWS_ACCESS_KEY_ID}
    secret_key: ${AWS_SECRET_ACCESS_KEY}
    default_ami: ami-0c55b159cbfafe1f0 # RHEL/CentOS AMI
    subnet_id: subnet-xxxxx
    security_group_ids:
      - sg-xxxxx
    key_name: quads-cloud-key
    max_instances: 50 # Maximum cloud instances to allow

  ibm_cloud:
    enabled: false # Enable when you want cloud overflow capacity
    api_key: ${IBM_CLOUD_API_KEY}
    region: us-south
    vpc_id: r006-xxxxx
    subnet_id: 0717-xxxxx
    resource_group_id: xxxxx
    ssh_key_id: r006-xxxxx
    default_image_id: r006-xxxxx # RHEL/CentOS image
    default_profile: cx2-2x4
    max_instances: 50

  email:
    enabled: true
    mail_display_name: QUADS Scheduler
    smtp_host: mail.example.com
    smtp_port: 25
    from_address: quads@redhat.com
    reply_to: dev-null@redhat.com
    user_agent: Rufus Postman 2.2.6
    report_cc: someuser@example.com, someuser@example.com, someuser@example.com, someuser@example.com

  libvirt:
    enabled: false
    # Map hypervisor FQDN (stored in host.rack) to its sushy-emulator base URL.
    hypervisors:
      libvirt-host.example.com: "http://libvirt-host.example.com:8000"

  badfish:
    enabled: true
    ipmi_username: root
    ipmi_password: password
    # Comma-separated model/name fragments for Supermicro hosts that should
    # skip Badfish and use the raw ipmitool path instead.
    # skip_for_supermicro_models: 6029p, 1028r, 1029u

  foreman:
    enabled: true
    url: http://foreman.example.com/hosts/
    api_url: https://foreman.example.com/api/v2
    username: admin
    password: ${FOREMAN_PASSWORD}
    token: ${FOREMAN_TOKEN}
    # more foreman settings for your OS, medium, partition table
    default_os: "RHEL 7"
    default_ptable: "generic-rhel7"
    default_medium: "RHEL Local"
    default_boot_order: "foreman"
    # Foreman RBAC fix ignore
    # variable to pass cloud names to be excluded from foreman_heal
    # with values separated by pipes 'cloud32|cloud04' or singularly 'cloud02'
    rbac_exclude:
    # Email used when creating new QUADS cloud users in Foreman.
    # Defaults to email.from_address if not set.
    rbac_user_mail:
    # Foreman auth-source ID for new cloud users (1 = built-in internal auth).
    rbac_auth_source_id: 1

  standard:
    enabled: true
    # Number of retry attempts for IPMI credential set + verify
    ipmi_credential_retries: 3
    # Delay in seconds between retry attempts (per-host, runs in parallel)
    ipmi_credential_retry_delay: 10

  juniper:
    enabled: true
    username: scaleadmin

  jira:
    enabled: true
    # takes 2 values only, basic or token, defaults to basic
    # basic will make use of jira_username and jira_password
    # token will make use of jira_token
    auth_type: basic
    url: https://issues.example.com/rest/api/2
    username: ${JIRA_USERNAME}
    password: ${JIRA_PASSWORD}
    token: ${JIRA_TOKEN}
    ticket_queue: SCALELAB

  environment:
    enabled: true

  # dayzero - post-release plugins
  # lab-admin plugins go in /opt/quads/plugins/dayzero/
  cloudcmd:
    enabled: true

  # clouddata - drops /root/quads_env.yml on the first host per cloud
  clouddata:
    enabled: true
