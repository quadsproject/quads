# Turn on or off ss globally
ssm_enable: true
# Set max limit per self-schedule
ssm_host_limit: 10
# Set default lifetime in days for self-schedules
ssm_default_lifetime: 5
# How many clouds (and auth tokens, one per cloud) a unique user ID can have
ssm_user_cloud_limit: 3
# Set to true to create a Jira ticket when a self-schedule is created
ssm_jira_create_ticket: false

# Set the end date for the scheduling window
ssm_deadline_day: sunday
ssm_deadline_hour: 21

# Prefix for the description field of the self-schedulable resources
ssm_description_prefix: "[SSM]"

# Require an external authentication provider (e.g. Google OAuth/SSO) for new users.
# When false (default): users can self-register via POST /api/v3/register/ with any
# email+password. Legacy API workflows, self-scheduling, and CLI tools all work without
# SSO. This preserves backward compatibility.
# When true: the /register/ endpoint is disabled. New users must authenticate via a
# configured SSO provider or be pre-created by an administrator.
require_auth_provider: false