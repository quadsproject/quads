[tox]
envlist = py3{10,11,12,13}, flake8
skipsdist = True

[testenv]
setenv =
    CONTAINER_NAME = quads-test-db-{envname}
    DB_PORT = 5432
    SQLALCHEMY_DATABASE_URI = postgresql://postgres:postgres@localhost:5432/quads
    QUADS_CONF_DIR = {toxinidir}/conf
    QUADS_TEMPLATES_PATH = {toxinidir}/src/quads/templates
allowlist_externals =
    podman
    bash
    sleep
    flask
deps = -rrequirements.txt
       -rtests/requirements.txt
       .
commands_pre =
    bash -c 'podman stop {env:CONTAINER_NAME} 2>/dev/null || true'
    bash -c 'podman rm {env:CONTAINER_NAME} 2>/dev/null || true'
    podman run -d --name {env:CONTAINER_NAME} -e POSTGRES_PASSWORD=postgres -p {env:DB_PORT}:5432 postgres:latest
    bash -c 'for i in $(seq 1 30); do podman exec {env:CONTAINER_NAME} pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done'
    flask --app quads.server.app init-db
    bash -c 'flask --app quads.server.app run > /tmp/quads-test-server-{envname}.log 2>&1 & echo $! > /tmp/quads-test-server-{envname}.pid'

commands = pytest -vv -p no:warnings --cov=quads.cli --cov=quads.server --cov=quads.tools --cov=quads.plugins --cov-report=xml --cov-report=term --cov-config=.coveragerc --junitxml=junit-{envname}.xml

commands_post =
    bash -c 'kill $(cat /tmp/quads-test-server-{envname}.pid) 2>/dev/null || true'
    bash -c 'rm -f /tmp/quads-test-server-{envname}.pid /tmp/quads-test-server-{envname}.log'
    bash -c 'podman stop {env:CONTAINER_NAME} 2>/dev/null || true'
    bash -c 'podman rm {env:CONTAINER_NAME} 2>/dev/null || true'
