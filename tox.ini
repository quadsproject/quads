[tox]
envlist = py3{10,11,12,13}, flake8
skipsdist = True

[testenv]
setenv =
    CONTAINER_NAME = quads_db
    CONTAINER_IMAGE = quay.io/sclorg/postgresql-16-c9s
    DB_PORT = 5432
    SQLALCHEMY_DATABASE_URI = postgresql://quads:quads@localhost:5432/quads
    QUADS_CONF_DIR = {toxinidir}/conf
    QUADS_TEMPLATES_PATH = {toxinidir}/src/quads/templates
allowlist_externals =
    podman
    bash
    sleep
    flask
deps = -rrequirements.txt
       -rtests/requirements.txt
       .
commands_pre =
    bash -c 'podman stop {env:CONTAINER_NAME} 2>/dev/null || true'
    bash -c 'podman rm {env:CONTAINER_NAME} 2>/dev/null || true'
    podman run -d --name {env:CONTAINER_NAME} -e POSTGRESQL_USER=quads -e POSTGRESQL_PASSWORD=quads -e POSTGRESQL_DATABASE=quads -p {env:DB_PORT}:5432 {env:CONTAINER_IMAGE}
    bash -c 'for i in $(seq 1 30); do if pg_isready -h localhost -p {env:DB_PORT} -U quads >/dev/null 2>&1; then echo "PostgreSQL is ready"; break; else echo "Waiting for PostgreSQL... ($i/30)"; sleep 1; fi; done'
    flask --app quads.server.app init-db
    bash -c 'flask --app quads.server.app run > quads_api.log 2>&1 & echo $! > /tmp/quads-test-server-{envname}.pid'

commands = pytest -vv -p no:warnings --cov=quads.cli --cov=quads.server --cov=quads.tools --cov=quads.plugins --cov-report=xml --cov-report=term --cov-config=.coveragerc --junitxml=junit-{envname}.xml

commands_post =
    bash -c 'kill $(cat /tmp/quads-test-server-{envname}.pid) 2>/dev/null || true'
    bash -c 'rm -f /tmp/quads-test-server-{envname}.pid'
    bash -c 'podman stop {env:CONTAINER_NAME} 2>/dev/null || true'
    bash -c 'podman rm {env:CONTAINER_NAME} 2>/dev/null || true'

[testenv:flake8]
deps = flake8
allowlist_externals = bash
commands_pre =
commands = bash -c 'rm -f junit-flake8.xml; flake8 --output-file flake8-output.txt src/ tests/'
commands_post =
